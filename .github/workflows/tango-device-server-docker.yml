# Tests, then builds and publishes the Tango device server (tango/, see
# CLAUDE.md's "Code layout") as a container image to the GitHub
# Container Registry, from images/tango-device-server/Dockerfile.
# Scoped to the Python sources via the paths filter below -- changes to
# the Go simulator don't trigger this workflow.
name: tango-device-server image

on:
  push:
    branches: [main]
    tags: ["tango-device-server-v*"]
    paths:
      - "tango/**"
      - "pyproject.toml"
      - "uv.lock"
      - "images/tango-device-server/**"
      - ".github/workflows/tango-device-server-docker.yml"
  pull_request:
    paths:
      - "tango/**"
      - "pyproject.toml"
      - "uv.lock"
      - "images/tango-device-server/**"
      - ".github/workflows/tango-device-server-docker.yml"
  workflow_dispatch: {}

# A ref (branch/tag) that pushes a new commit while an older run for the
# same ref is still building should cancel the stale run rather than race
# it for the same image tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io requires a lowercase path; github.repository can contain
  # uppercase (e.g. an org name), so this is normalized in the "image
  # metadata" step below rather than assumed lowercase here.
  IMAGE_BASE: ${{ github.repository }}/tango-device-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_BASE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver
            type=sha,prefix=0.1.0-dev.c,format=short
            type=raw,value=latest,enable={{is_default_branch}}
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 8

      # Pull requests build (to catch a broken Dockerfile/build early)
      # but never push -- publishing only happens from main/tags. The
      # base images (artefact.skao.int) are amd64-only, so this doesn't
      # go multi-arch the way the go-simulator image does.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/tango-device-server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
