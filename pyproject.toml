[project]
name = "ska-low-station-beam-simulator"
version = "0.1.0"
description = "Add your description here"
readme = "tango/README.md"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.83.1",
    "protobuf>=7.36.1",
    "ska-tango-base>=1.7.0",
]

[project.scripts]
station_beam_simulator_device_server = "ska_low_station_beam_simulator.simulator:main"

[[tool.uv.index]]
name = "skao"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Python sources live under tango/src (repo root is shared with the Go
# simulator prototype, see CLAUDE.md's "Code layout") -- hatchling's
# default src-layout autodetection only looks at <root>/src, so the
# package location must be given explicitly.
[tool.hatch.build.targets.wheel]
packages = ["tango/src/ska_low_station_beam_simulator"]

[tool.pytest.ini_options]
testpaths = ["tango/tests"]

# Without this, ruff's isort falls back to its default src roots (repo
# root + <root>/src) to decide what's first-party -- and since the repo
# root now literally has a directory named tango/ (see CLAUDE.md's "Code
# layout"), ruff mistakes `import tango` (pytango, third-party) for a
# first-party import of that directory, scattering `tango`/`tango.server`
# imports apart from the rest of a file's third-party block. Pointing
# src at the real package root fixes the misdetection at its source
# instead of hand-ordering imports around it in every affected file.
[tool.ruff]
src = ["tango/src"]
extend-exclude = ["tango/src/ska_low_station_beam_simulator/simulatorpb"]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "grpcio-tools>=1.83.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
