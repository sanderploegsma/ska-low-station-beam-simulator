{{- range $_, $s := .Values.simulator.stationIds }}
{{- $stationId := $s | int }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ska-low-station-beam-simulator.fullname" $ }}-{{ printf "%03d" $stationId }}
  labels:
    {{- include "ska-low-station-beam-simulator.labels" $ | nindent 4 }}
    station-beam-simulator.skao.int/station-id: {{ $stationId | quote }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  {{- if and (eq $.Values.service.type "LoadBalancer") $.Values.service.loadBalancerIP }}
  loadBalancerIP: {{ $.Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq $.Values.service.type "LoadBalancer") $.Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml $.Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  ports:
    - name: grpc
      port: {{ $.Values.service.port }}
      targetPort: grpc
      protocol: TCP
      appProtocol: grpc
  selector:
    {{- include "ska-low-station-beam-simulator.selectorLabels" $ | nindent 4 }}
    station-beam-simulator.skao.int/station-id: {{ $stationId | quote }}
{{- end }}
