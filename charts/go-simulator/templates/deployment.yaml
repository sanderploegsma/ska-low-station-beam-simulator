apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "go-simulator.fullname" . }}
  labels:
    {{- include "go-simulator.labels" . | nindent 4 }}
spec:
  # See values.yaml's top-of-file note: this chart is one release per
  # station, so replicaCount is expected to stay at 1 -- it's exposed
  # here (rather than hardcoded) only for cases like a rolling restart
  # via `helm upgrade`, not as a scaling knob.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "go-simulator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "go-simulator.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "go-simulator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.simulator.grpcPort }}
            - -station-id={{ .Values.simulator.stationId }}
            - -substation-id={{ .Values.simulator.substationId }}
            - -dest-ip={{ .Values.simulator.destIp }}
            - -dest-port={{ .Values.simulator.destPort }}
            {{- if .Values.simulator.sourceInterface }}
            - -spead-interface={{ .Values.simulator.sourceInterface }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.simulator.grpcPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
